<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div id="storage-banner" class="banner" role="status" hidden>이 브라우저에서는 데이터가 저장되지 않아요</div>

    <header class="header">
      <div>
        <h1>오늘의 할일</h1>
        <p id="today" class="today"></p>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크 모드로 전환">🌙</button>
    </header>

    <section class="progress" aria-label="진행률">
      <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-text" class="progress-text"></p>
    </section>

    <form id="add-form" class="add-form">
      <input id="add-input" type="text" placeholder="할 일을 입력하세요..." aria-label="새 할일" autocomplete="off" maxlength="200" autofocus>
      <button type="submit" class="primary-btn">추가</button>
    </form>

    <button id="carry-btn" class="carry-btn" type="button" hidden></button>

    <nav class="filters" aria-label="필터">
      <button type="button" data-filter="all">전체</button>
      <button type="button" data-filter="active">진행 중</button>
      <button type="button" data-filter="done">완료</button>
    </nav>

    <p id="all-done" class="all-done" role="status" hidden>오늘 할 일을 모두 끝냈어요! 🎉</p>

    <ul id="list" class="list" aria-label="할일 목록"></ul>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">📝</div>
      <p id="empty-text"></p>
    </div>

    <footer class="footer">
      <span id="remaining"></span>
      <button id="clear-done" class="text-btn" type="button">완료된 항목 지우기</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
